<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEON HIGHWAY V2 — 출근길 추월</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#1e3155,#080e1d 75%);color:#eef6ff;font-family:system-ui, sans-serif;display:grid;place-items:center}main{width:min(96vw,450px);padding:10px}header,.stats,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(20px,5vw,27px);margin:5px 0}.muted{color:#a5b8d8;font-size:12px}.stats{background:#12203b;border:1px solid #31466e;border-radius:12px;padding:10px;margin:8px 0}.stat{text-align:center;font-size:23px;font-weight:800}.stat small{font-size:11px;font-weight:400;color:#9db3d3;display:block}.field{height:min(59dvh,530px);min-height:250px;border:2px solid #42659c;border-radius:13px;position:relative;overflow:hidden;background:#0e1526}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;background:#080f21e8;display:grid;align-content:center;justify-items:center;text-align:center;padding:22px;gap:12px}.overlay h2{font-size:29px;margin:0}.overlay p{line-height:1.55;color:#bfd2ee;margin:0}button{border:0;cursor:pointer;touch-action:manipulation;background:#233c69;color:white;padding:12px 18px;border-radius:12px;font-size:17px;font-weight:750;min-height:48px}.mainbtn{background:linear-gradient(110deg,#09b5ce,#6366f1)}.controls{margin:10px 0}.controls button{flex:1;font-size:28px}#pause{font-size:13px;min-height:35px;padding:7px 12px}#float{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-weight:900;font-size:34px;color:#67f9ce;opacity:0;pointer-events:none}@media(max-height:640px){.field{height:48dvh;min-height:225px}.stats{padding:5px}button{min-height:40px;padding:6px}}
</style></head><body><main><header><div><span class="muted">ARCADE · 60 SECOND CHALLENGE</span><h1>NEON HIGHWAY <span style="color:#5df5d2">2.0</span></h1></div><button id="pause">일시정지</button></header><div class="stats"><div class="stat"><small>추월</small><span id="score">0</span></div><div class="stat"><small>남은 시간</small><span id="time">60</span>s</div><div class="stat"><small>최고 점수</small><span id="best">0</span></div></div><div class="field" id="field"><canvas id="canvas"></canvas><div id="float">+1</div><div class="overlay" id="overlay"><h2 id="title">출근길 추월</h2><p id="description">60초 동안 앞차를 피해서 추월하세요.<br>← → / A D 또는 화면 버튼으로 이동</p><button id="start" class="mainbtn">게임 시작</button></div></div><div class="controls"><button id="left" aria-label="왼쪽 차선으로 이동">◀</button><button id="right" aria-label="오른쪽 차선으로 이동">▶</button></div><div class="muted">앞차와 부딪히거나 시간이 끝나면 게임 종료 · 모바일 지원</div></main>
<script>
(()=>{const $=s=>document.querySelector(s),c=$('#canvas'),ctx=c.getContext('2d'),field=$('#field');let w=320,h=400,lane=1,cars=[],score=0,time=60,elapsed=0,spawn=0,road=0,mode='ready',last=0,toast=0,flash=0,highest=0,loopId=0;try{highest=Number(localStorage.getItem('nh2-best')||0)||0}catch(e){}$('#best').textContent=highest;
function resize(){const r=field.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width-4;h=r.height-4;c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const X=l=>w*(l+.5)/3,CW=()=>Math.min(w*.20,65),CH=()=>Math.min(h*.16,77),PY=()=>h-CH()-18;
function drawCar(x,y,color,other=false){const cw=CW(),ch=CH();ctx.fillStyle='#0006';ctx.fillRect(x-cw/2+4,y+5,cw,ch);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x-cw/2,y,cw,ch,7);ctx.fill();ctx.fillStyle='#0c2239';ctx.fillRect(x-cw*.34,y+ch*.2,cw*.68,ch*.28);ctx.fillStyle=other?'#ffb5b5':'#aefbff';ctx.fillRect(x-cw*.31,y+ch*.73,cw*.62,ch*.1);ctx.fillStyle='#ffef9d';ctx.fillRect(x-cw*.42,y+4,8,6);ctx.fillRect(x+cw*.42-8,y+4,8,6)}
function render(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#1b2437';ctx.fillRect(0,0,w,h);ctx.fillStyle='#26364b';ctx.fillRect(5,0,w-10,h);ctx.fillStyle='#ffcf62';ctx.fillRect(7,0,4,h);ctx.fillRect(w-11,0,4,h);ctx.fillStyle='#c5d5e277';for(let i=1;i<3;i++){const x=w*i/3;for(let y=-65+road%65;y<h;y+=65)ctx.fillRect(x-2,y,4,32)}cars.forEach(o=>drawCar(X(o.lane),o.y,o.color,true));drawCar(X(lane),PY(),'#00cced');if(flash>0){ctx.fillStyle='rgba(255,35,55,'+(flash*.5)+')';ctx.fillRect(0,0,w,h)}$('#float').style.opacity=toast>0?1:0}
function sound(freq){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.11);o.start();o.stop(a.currentTime+.12);o.onended=()=>a.close()}catch(e){}}
function move(dir){if(mode!=='running')return;lane=Math.max(0,Math.min(2,lane+dir))}
$('#left').onclick=()=>move(-1);$('#right').onclick=()=>move(1);addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' '){if(mode==='running'||mode==='paused')pauseGame();else if(mode==='ready'||mode==='ended')restart()}});
function show(title,desc,button){$('#title').textContent=title;$('#description').textContent=desc;$('#start').textContent=button;$('#overlay').hidden=false;$('#overlay').style.display='grid'}
function end(why){mode='ended';if(score>highest){highest=score;try{localStorage.setItem('nh2-best',String(highest))}catch(e){}}$('#best').textContent=highest;show('추월 '+score+'대!',why+' · 최고 기록 '+highest+'대','한 판 더');sound(130)}
function restart(){lane=1;cars=[];score=0;time=60;elapsed=0;spawn=0;road=0;toast=0;flash=0;mode='running';last=performance.now();$('#score').textContent=0;$('#time').textContent=60;$('#overlay').hidden=true;$('#overlay').style.display='none';$('#pause').textContent='일시정지'}
function pauseGame(){if(mode==='running'){mode='paused';show('일시정지','계속 버튼을 눌러 이어서 플레이하세요','계속하기');$('#pause').textContent='계속'}else if(mode==='paused'){mode='running';last=performance.now();$('#overlay').style.display='none';$('#pause').textContent='일시정지'}}
$('#start').onclick=()=>mode==='paused'?pauseGame():restart();$('#pause').onclick=pauseGame;
function update(dt){elapsed+=dt;time=Math.max(0,60-elapsed);$('#time').textContent=Math.ceil(time);if(time===0){end('60초 완료');return}const level=Math.floor(elapsed/15),speed=(h/2.6)*(1+level*.13),interval=Math.max(.65,1.5-level*.2);road+=speed*dt;spawn+=dt;while(spawn>=interval){spawn-=interval;const choices=[0,1,2];const prev=cars.find(o=>o.y<CH()*1.6);const allowed=prev?choices.filter(n=>n!==prev.lane):choices;const next=allowed[Math.floor(Math.random()*allowed.length)];cars.push({lane:next,y:-CH()-8,color:['#ff6379','#ffba59','#a581ff'][Math.floor(Math.random()*3)],threat:next===lane,avoided:false})}
for(const o of cars){const oldY=o.y;o.y+=speed*dt;if(o.lane===lane&&o.y<PY()+CH()*.3&&o.y+CH()>PY()-CH()*.3){flash=.65;end('앞차와 충돌');return}if(o.threat&&o.lane!==lane)o.avoided=true;if(o.avoided&&!o.scored&&oldY<=PY()+CH()*.25&&o.y>PY()+CH()*.25){o.scored=true;score++;toast=.85;$('#score').textContent=score;sound(700)}}cars=cars.filter(o=>o.y<h+CH());toast=Math.max(0,toast-dt);flash=Math.max(0,flash-dt)}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;if(mode==='running')update(dt);render();loopId=requestAnimationFrame(frame)}loopId=requestAnimationFrame(frame);
})();
</script></body></html>
