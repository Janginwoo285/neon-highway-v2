<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>장애물 피하기</title>
<style>
:root{--bg:#0E1116;--panel:#171B22;--ink:#F5F5F7;--mute:#8B93A1;--blue:#0A84FF;--red:#FF453A;--yellow:#FFD60A;--green:#30D158;--orange:#FF9F0A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
.wrap{max-width:440px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 4px 8px}
.score{font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.sub{font-size:12px;color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums}
.right{text-align:right}
.best{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.best b{color:var(--ink)}
.fuel{display:flex;align-items:center;gap:6px;margin-top:6px;justify-content:flex-end;font-size:12px;color:var(--mute)}
.gauge{width:90px;height:8px;border-radius:4px;background:#2A2F38;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .15s}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:18px;max-width:100%;max-height:100%;background:#22262E;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.ctrl{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;margin-top:12px}
.ctrl button{height:68px;border:0;border-radius:18px;background:var(--panel);color:var(--ink);font-size:26px;cursor:pointer;transition:transform .08s,background .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.ctrl button:active,.ctrl button.on{transform:scale(.95);background:#252B35}
.ctrl #up{background:linear-gradient(180deg,#2A2216,#1E1A13);color:var(--yellow)}
.ctrl #up.on{background:linear-gradient(180deg,#4A3510,#2E2410)}
.ctrl #up small{display:block;font-size:11px;color:var(--mute);margin-top:-2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:330px;background:rgba(23,27,34,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px 20px;text-align:center}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:-.03em}
.card p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.big{font-size:56px;font-weight:800;letter-spacing:-.05em;margin:6px 0 0;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;background:var(--yellow);color:#1a1400;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;margin-top:6px}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0 4px;font-size:13px;color:var(--mute)}
.stats b{display:block;color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.go{margin-top:16px;width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.how{text-align:left;margin:16px 0 0;font-size:13px;color:var(--mute);line-height:1.8}
.how span{display:inline-block;min-width:22px}
.recs{margin-top:14px;text-align:left;font-size:13px}
.recs .r{display:flex;justify-content:space-between;padding:6px 2px;border-top:1px solid rgba(255,255,255,.07);color:var(--mute);font-variant-numeric:tabular-nums}
.recs .r b{color:var(--ink)}
.recs .r.me b{color:var(--yellow)}
.hint{font-size:12px;color:var(--mute);margin-top:10px}
.hidden{display:none}
.mute-btn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:15px;cursor:pointer;z-index:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div>
      <div class="score" id="score">0</div>
      <div class="sub" id="sub">0.0초 · 피한 장애물 0</div>
    </div>
    <div class="right">
      <div class="best">최고 <b id="best">0</b></div>
      <div class="fuel">⛽ <div class="gauge"><i id="gauge"></i></div></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" width="360" height="640" aria-label="게임 화면"></canvas>
    <button class="mute-btn" id="mute" aria-label="소리 켜기/끄기">🔊</button>
    <div class="overlay" id="start">
      <div class="card">
        <h1>장애물 피하기</h1>
        <p>최대한 오래 버티고, 기름을 먹어 부스트로 점수 3배!</p>
        <div class="how">
          <div><span>◀ ▶</span> 차선 바꾸기 (3차선)</div>
          <div><span>▲</span> 누르고 있으면 앞으로 전진! 빨라지고 점수 1.5배, 대신 피할 시간이 줄어요</div>
          <div><span>⛽</span> 장애물 3개를 피하면 나와요. 먹자마자 부스트, 점수 3배</div>
          <div><span>🍌</span> 밟으면 빙글 돌다가 게임오버</div>
          <div><span>🚧</span> 차·공사 콘·구덩이에 부딪히면 게임오버</div>
        </div>
        <button class="go" id="startBtn">시작하기</button>
        <div class="hint">키보드: ← → ↑ · 스페이스로 시작</div>
      </div>
    </div>
    <div class="overlay hidden" id="over">
      <div class="card">
        <p id="why">차에 부딪혔어요</p>
        <div class="big" id="final">0</div>
        <div id="nb"></div>
        <div class="stats"><div><b id="ft">0.0초</b>버틴 시간</div><div><b id="fd">0</b>피한 장애물</div><div><b id="ff">0</b>먹은 기름</div></div>
        <div class="recs" id="recs"></div>
        <button class="go" id="againBtn">다시 하기</button>
        <div class="hint">스페이스 또는 ▲로 바로 다시 시작</div>
      </div>
    </div>
  </div>
  <div class="ctrl">
    <button id="left" aria-label="왼쪽">◀</button>
    <button id="up" aria-label="전진">▲<small>전진</small></button>
    <button id="right" aria-label="오른쪽">▶</button>
  </div>
</div>

<script>
/* ---------- 설정 ---------- */
const W=360,H=640,LANES=[80,180,280],PY=H-120,CW=46,CH=78;
const BASE=250,ACC=5,MAXS=640,BOOST=1.8,MULT=3,DRAIN=24,FUEL_ADD=100,FWD_SPEED=1.2,FWD_MULT=1.5,FWD_DIST=130;
const KEY='dodge.v1';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

/* 화면 비율 맞추기 (선명하게) */
function fit(){const st=$('stage').getBoundingClientRect();const sc=Math.min(st.width/W,st.height/H);
  cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',fit);

/* ---------- 기록 ---------- */
let store={best:0,runs:[],mute:false};
try{store={...store,...JSON.parse(localStorage.getItem(KEY))}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
$('best').textContent=store.best;

/* ---------- 소리 ---------- */
let ac=null;
function beep(f,d=.08,type='sine',v=.08,slide=0){if(store.mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);
  g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('mute').textContent=store.mute?'🔇':'🔊';
$('mute').onclick=()=>{store.mute=!store.mute;save();$('mute').textContent=store.mute?'🔇':'🔊'};

/* ---------- 상태 ---------- */
let G;
function reset(){G={state:'play',t:0,dist:0,score:0,speed:BASE,lane:1,px:LANES[1],objs:[],nextRow:220,prevN:1,prevFree:[0,1,2],
  dodges:0,streak:0,fuelPending:false,fuel:0,fuels:0,boost:false,skid:0,spin:0,rot:0,shake:0,flash:0,floats:[],roadOff:0,why:'',lowFuelT:0,lines:[],milestone:500,fwd:0,py:PY,wasBoost:false}}
reset();G.state='ready';

/* ---------- 입력 ---------- */
let upHeld=false;
function move(d){if(G.state!=='play'||G.spin)return;const n=Math.max(0,Math.min(2,G.lane+d));if(n!==G.lane){G.lane=n;beep(520,.05,'triangle',.05)}}
function setUp(v){if(v&&!upHeld&&G.state!=='play')begin();upHeld=v;$('up').classList.toggle('on',v)}
function begin(){if(G.state==='play')return;reset();$('start').classList.add('hidden');$('over').classList.add('hidden');beep(660,.1,'triangle',.06,990)}
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space'].includes(e.key)||e.code==='Space')e.preventDefault();
  if(e.repeat&&e.key!=='ArrowUp')return;
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key==='ArrowUp'||e.key==='w'){if(!upHeld)setUp(true)}
  else if((e.code==='Space'||e.key==='Enter')&&G.state!=='play')begin();
});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')setUp(false)});
const hold=(el,down,up)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture&&el.setPointerCapture(e.pointerId);down()});
  if(up){['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,up))}};
hold($('left'),()=>{$('left').classList.add('on');move(-1)},()=>$('left').classList.remove('on'));
hold($('right'),()=>{$('right').classList.add('on');move(1)},()=>$('right').classList.remove('on'));
hold($('up'),()=>setUp(true),()=>setUp(false));
$('startBtn').onclick=begin;$('againBtn').onclick=begin;
/* 화면 스와이프 */
let sx=null;cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;if(Math.abs(dx)>24)move(dx>0?1:-1);else{const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)}sx=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden)upHeld=false});

/* ---------- 생성 ---------- */
const CAR_COLORS=['#FF453A','#FF9F0A','#BF5AF2','#64D2FF','#FFD60A','#30D158'];
function spawnRow(){
  const hard=Math.min(.55,.12+G.t*.006);
  const n=Math.random()<hard?2:1;
  let free;
  if(n===2){
    // 연속 2대 줄이면 빈 차선이 한 칸 이내로만 이동 (항상 피할 수 있게)
    const opts=G.prevN===2?[0,1,2].filter(l=>Math.abs(l-G.prevFree[0])<=1):[0,1,2];
    free=[opts[(Math.random()*opts.length)|0]];
  }else{const c=(Math.random()*3)|0;free=[0,1,2].filter(l=>l!==c)}
  const cars=[0,1,2].filter(l=>!free.includes(l));
  const y=-CH;
  const lowP=Math.min(.4,.15+G.t*.005);
  cars.forEach(l=>{const r=Math.random();
    if(r<lowP*.55)G.objs.push({type:'cone',lane:l,x:LANES[l],y:y+20,rel:0,counted:false});
    else if(r<lowP)G.objs.push({type:'hole',lane:l,x:LANES[l],y:y+20,rel:0,counted:false});
    else G.objs.push({type:'car',lane:l,x:LANES[l],y,c:CAR_COLORS[(Math.random()*CAR_COLORS.length)|0],rel:0,counted:false})});
  const f=free.slice();
  if(G.fuelPending&&f.length){const l=f.splice((Math.random()*f.length)|0,1)[0];G.objs.push({type:'fuel',lane:l,x:LANES[l],y:y+10});G.fuelPending=false}
  else if(f.length>=2&&Math.random()<.2){const l=f[(Math.random()*f.length)|0];G.objs.push({type:'banana',lane:l,x:LANES[l],y:y+20})}
  // 줄 간격은 '시간' 기준: 처음엔 여유 있게, 갈수록 촘촘하게 (최소 0.62초)
  const gapT=Math.max(.62,1.15-G.t*.008)+(n===2&&G.prevN===2&&free[0]!==G.prevFree[0]?.18:0);
  G.prevN=n;G.prevFree=free;
  G.nextRow=G.dist+Math.max(CH*2+40,G.speed*gapT)*(1+Math.random()*.25);
}
function float(txt,x,y,c){G.floats.push({txt,x,y,c,life:.9})}

/* ---------- 업데이트 ---------- */
function update(dt){
  if(G.state!=='play')return;
  G.t+=dt;
  // 부스트
  G.boost=G.fuel>0&&!G.spin;
  if(G.boost)G.fuel=Math.max(0,G.fuel-DRAIN*dt);
  if(G.wasBoost&&!G.boost&&!G.spin){float('부스트 끝',G.px,G.py-70,'#8B93A1');beep(500,.15,'triangle',.05,300)}
  G.wasBoost=G.boost;
  const fwdOn=upHeld&&!G.spin;
  G.fwd=fwdOn?Math.min(1,G.fwd+dt*2.6):Math.max(0,G.fwd-dt*1.6);
  G.py=PY-G.fwd*FWD_DIST;
  const base=Math.min(MAXS,BASE+G.t*ACC);
  const target=base*(G.boost?BOOST:1)*(fwdOn?FWD_SPEED:1);
  G.speed+= (target-G.speed)*Math.min(1,dt*4);
  const sp=G.spin?G.speed*.5:G.speed;
  G.dist+=sp*dt;G.roadOff=(G.roadOff+sp*dt)%60;
  G.score+=sp*dt*.1*(G.boost?MULT:1)*(fwdOn?FWD_MULT:1);G.mult=(G.boost?MULT:1)*(fwdOn?FWD_MULT:1);
  if(G.score>=G.milestone){float(`${G.milestone}점!`,W/2,H/2-60,'#FFD60A');beep(880,.12,'triangle',.06,1320);G.milestone+=500}
  // 플레이어 이동
  G.px+=(LANES[G.lane]-G.px)*Math.min(1,dt*16);
  if(G.skid>0){G.skid-=dt;G.rot=Math.sin(G.skid*40)*.25}else if(!G.spin)G.rot*=.8;
  if(G.spin){G.spin-=dt;G.rot+=dt*18;if(G.spin<=0)end('바나나에 미끄러져 빙글 돌았어요')}
  if(G.state!=='play')return;
  // 부스트 바람 선
  if(G.boost&&Math.random()<.6)G.lines.push({x:30+Math.random()*300,y:-20,l:30+Math.random()*50});
  G.lines.forEach(l=>l.y+=sp*dt*1.6);G.lines=G.lines.filter(l=>l.y<H+60);
  // 생성
  if(G.dist>=G.nextRow)spawnRow();
  // 물체
  for(const o of G.objs){o.y+=sp*dt*(o.type==='car'?1-o.rel:1);
    if((o.type==='car'||o.type==='cone'||o.type==='hole')&&!o.counted&&o.y>G.py+CH){o.counted=true;if(G.state!=='play')continue;
      G.dodges++;G.streak++;G.score+=5;float('+5',o.x,G.py-10,'#30D158');
      if(G.streak>=3){G.streak=0;G.fuelPending=true}}
  }
  G.objs=G.objs.filter(o=>o.y<H+100&&!o.dead);
  // 충돌
  const air=false;
  if(!G.spin)for(const o of G.objs){
    const dx=Math.abs(o.x-G.px),dy=Math.abs(o.y-G.py);
    if(o.type==='car'&&dx<CW-6&&dy<CH-10){crash('차에 부딪혔어요');return}
    if(o.type==='cone'&&!air&&dx<34&&dy<44){crash('공사 콘에 부딪혔어요');return}
    if(o.type==='hole'&&!air&&dx<38&&dy<38){crash('구덩이에 빠졌어요');return}
    if(o.type==='fuel'&&dx<40&&dy<50){o.dead=true;G.fuel=Math.min(100,G.fuel+FUEL_ADD);G.fuels++;float('부스트! 점수 x3',W/2,G.py-90,'#FFD60A');beep(700,.12,'triangle',.07,1100);beep(1100,.25,'sawtooth',.03,1600)}
    if(o.type==='banana'&&!air&&dx<34&&dy<38){o.dead=true;G.spin=.8;G.fuel=0;G.flash=.5;beep(400,.75,'square',.06,80);float('빙글빙글!',G.px,G.py-70,'#FFD60A')}
  }
  G.floats.forEach(f=>{f.life-=dt;f.y-=40*dt});G.floats=G.floats.filter(f=>f.life>0);
}
function crash(why){G.shake=.4;G.flash=1;beep(120,.35,'sawtooth',.12,50);end(why)}
function end(why){G.state='over';G.why=why;upHeld=false;$('up').classList.remove('on');
  const sc=Math.floor(G.score),isBest=sc>store.best;if(isBest)store.best=sc;
  const run={s:sc,t:+G.t.toFixed(1),d:Date.now()};store.runs=[run,...store.runs].slice(0,20);save();
  const runG=G;
  setTimeout(()=>{if(G!==runG)return;$('why').textContent=why;$('final').textContent=sc;$('nb').innerHTML=isBest&&sc>0?'<span class="newbest">새 최고 기록</span>':'';
    $('ft').textContent=G.t.toFixed(1)+'초';$('fd').textContent=G.dodges;$('ff').textContent=G.fuels;$('best').textContent=store.best;
    const top=[...store.runs].sort((a,b)=>b.s-a.s).slice(0,5);
    $('recs').innerHTML='<div style="color:var(--mute);margin-bottom:4px">내 기록 TOP 5</div>'+top.map((r,i)=>`<div class="r ${r===run?'me':''}"><span>${i+1}위 · ${r.t}초</span><b>${r.s}</b></div>`).join('');
    $('over').classList.remove('hidden')},isBest?500:350);
}

/* ---------- 그리기 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function car(x,y,c,rot,player){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='rgba(0,0,0,.28)';rr(-CW/2+3,-CH/2+6,CW,CH,10);ctx.fill();
  ctx.fillStyle=c;rr(-CW/2,-CH/2,CW,CH,10);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.35)';rr(-CW/2+6,-CH/2+(player?10:44),CW-12,18,5);ctx.fill();rr(-CW/2+6,-CH/2+(player?46:12),CW-12,14,5);ctx.fill();
  ctx.fillStyle=player?'#FFF7C2':'#FF6B60';if(player){ctx.fillRect(-CW/2+5,-CH/2+1,9,4);ctx.fillRect(CW/2-14,-CH/2+1,9,4)}else{ctx.fillRect(-CW/2+5,CH/2-5,9,4);ctx.fillRect(CW/2-14,CH/2-5,9,4)}
  ctx.restore()}
function draw(){
  ctx.save();
  if(G.shake>0){G.shake-=1/60;ctx.translate((Math.random()-.5)*12*G.shake,(Math.random()-.5)*12*G.shake)}
  // 도로
  ctx.fillStyle='#22262E';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1A1D23';ctx.fillRect(0,0,26,H);ctx.fillRect(W-26,0,26,H);
  ctx.fillStyle='#FFD60A';ctx.fillRect(26,0,4,H);ctx.fillRect(W-30,0,4,H);
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(const lx of [130,230])for(let y=-60+G.roadOff;y<H;y+=60)ctx.fillRect(lx-2,y,4,32);
  // 부스트 선
  ctx.strokeStyle='rgba(255,214,10,.35)';ctx.lineWidth=2;G.lines.forEach(l=>{ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x,l.y+l.l);ctx.stroke()});
  // 물체
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const o of G.objs){
    if(o.type==='car')car(o.x,o.y,o.c,0,false);
    else if(o.type==='banana'){ctx.font='32px serif';ctx.fillText('🍌',o.x,o.y)}
    else if(o.type==='cone'){ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(3,20,20,6,0,0,7);ctx.fill();
      ctx.fillStyle='#3A3F48';rr(-19,14,38,8,3);ctx.fill();ctx.fillStyle='#FF7A1A';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(14,15);ctx.lineTo(-14,15);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-5.5,-8);ctx.lineTo(5.5,-8);ctx.lineTo(7.5,-2);ctx.lineTo(-7.5,-2);ctx.fill();ctx.beginPath();ctx.moveTo(-9.5,4);ctx.lineTo(9.5,4);ctx.lineTo(11.5,9);ctx.lineTo(-11.5,9);ctx.fill();ctx.restore()}
    else if(o.type==='hole'){ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='#3B3F47';ctx.beginPath();ctx.ellipse(0,0,30,20,0,0,7);ctx.fill();
      ctx.fillStyle='#0B0D10';ctx.beginPath();ctx.ellipse(0,2,23,14,0,0,7);ctx.fill();ctx.strokeStyle='#4A4F58';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(26,-6);ctx.lineTo(36,-12);ctx.moveTo(-25,8);ctx.lineTo(-36,14);ctx.moveTo(-8,-18);ctx.lineTo(-12,-27);ctx.stroke();ctx.restore()}
    else{const p=1+Math.sin(G.t*8)*.08;ctx.save();ctx.translate(o.x,o.y);ctx.scale(p,p);ctx.fillStyle='rgba(255,214,10,.22)';ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();ctx.font='30px serif';ctx.fillText('⛽',0,1);ctx.restore()}
  }
  // 플레이어
  const fy=G.py;
  if(G.fwd>.05||G.boost){ctx.fillStyle=G.boost?'rgba(255,159,10,.6)':'rgba(100,210,255,.45)';const fl=G.boost?26:12+G.fwd*8;
    for(const ox of [-11,11]){ctx.beginPath();ctx.moveTo(G.px+ox-5,fy+CH/2);ctx.lineTo(G.px+ox,fy+CH/2+fl+Math.random()*10);ctx.lineTo(G.px+ox+5,fy+CH/2);ctx.fill()}}
  car(G.px,fy,'#0A84FF',G.rot,true);
  if(G.fuel>0){const bw=56;ctx.fillStyle='rgba(0,0,0,.5)';rr(G.px-bw/2,fy+CH/2+(G.boost?34:14),bw,7,4);ctx.fill();ctx.fillStyle=G.fuel<25?'#FF453A':'#FFD60A';rr(G.px-bw/2,fy+CH/2+(G.boost?34:14),bw*G.fuel/100,7,4);ctx.fill()}
  // 떠다니는 글자
  ctx.font='bold 18px -apple-system,sans-serif';
  G.floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)});ctx.globalAlpha=1;
  // 연속 피하기 표시
  if(G.state==='play'){ctx.font='600 13px -apple-system,sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';
    if(G.boost){ctx.fillStyle='rgba(0,0,0,.45)';rr(W/2-90,10,180,26,13);ctx.fill();ctx.fillStyle='#FFD60A';rr(W/2-86,14,172*G.fuel/100,18,9);ctx.fill();
      ctx.fillStyle='#1a1400';ctx.font='800 12px -apple-system,sans-serif';ctx.fillText('부스트 x3',W/2,23)}
    else ctx.fillText(G.fuelPending?'⛽ 곧 기름이 나와요':`기름까지 ${3-G.streak}개`,W/2,22)}
  ctx.restore();
  if(G.flash>0){ctx.fillStyle=`rgba(255,69,58,${G.flash*.45})`;ctx.fillRect(0,0,W,H);G.flash=Math.max(0,G.flash-.04)}
}
function hud(){$('score').textContent=Math.floor(G.score);$('sub').textContent=`${G.t.toFixed(1)}초 · 피한 장애물 ${G.dodges}${G.mult>1?' · 점수 x'+G.mult:''}`;
  $('gauge').style.width=G.fuel+'%'}

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();hud();requestAnimationFrame(loop)}
fit();requestAnimationFrame(loop);
</script>
