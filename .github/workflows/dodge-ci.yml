name: Dodge Online CI
on:
  push:
    paths:
      - 'dodge-server/**'
      - 'dodge-online/**'
      - '.github/workflows/dodge-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: dodge-server/pom.xml
      - name: Compile Spring Boot backend and run tests
        run: mvn -B -f dodge-server/pom.xml test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser game JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dodge-online/index.html', 'utf8');
          const m = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) throw new Error('Inline game JavaScript missing');
          new Function(m[1]);
          console.log('Game JavaScript syntax valid');
          NODE
